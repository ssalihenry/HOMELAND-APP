name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 DECODE THE KEYSTORE
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

    # 🔥 FIX: Use the Gradle Wrapper (./gradlew) with retries
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Release APK (with retry)
      run: |
        for i in {1..3}; do
          echo "Attempt $i..."
          ./gradlew assembleRelease --no-daemon && break || {
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed."
              exit 1
            fi
            echo "Build failed, retrying in 10 seconds..."
            sleep 10
          }
        done
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # 🔥 UPLOAD THE APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Homeland-v1.4.0-Release
        path: app/build/outputs/apk/release/*.apk
