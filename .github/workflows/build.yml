name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 DECODE THE KEYSTORE
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

    # 🔥 Try to provision Gradle 8.4. If GitHub's CDN is down, continue anyway
    #    (the Ubuntu runner has a pre-installed Gradle we can fall back to)
    - name: Setup Gradle (optional - ignore errors)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
      continue-on-error: true

    # 🔥 BUILD THE RELEASE APK (with 3 retries in case of transient failures)
    - name: Build Release APK
      run: |
        for i in 1 2 3; do
          echo "===== Attempt $i ====="
          gradle assembleRelease --no-daemon && break || {
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed."
              exit 1
            fi
            echo "Retrying in 15 seconds..."
            sleep 15
          }
        done
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # 🔥 UPLOAD THE APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Homeland-v1.4.0-Release
        path: app/build/outputs/apk/release/*.apk
