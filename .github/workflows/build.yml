name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 DECODE THE KEYSTORE
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

    # 🔥 FIX: Generate the Gradle Wrapper for version 8.4
    #    This uses the runner's pre-installed Gradle to create wrapper files
    #    that will force the build to use Gradle 8.4.
    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "Gradle wrapper not found. Generating for Gradle 8.4..."
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
        else
          echo "Gradle wrapper already exists."
        fi

    # 🔥 BUILD THE RELEASE APK (with retries)
    - name: Build Release APK
      run: |
        for i in 1 2 3; do
          echo "===== Attempt $i ====="
          ./gradlew assembleRelease --no-daemon && break || {
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed."
              exit 1
            fi
            echo "Retrying in 15 seconds..."
            sleep 15
          }
        done
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # 🔥 UPLOAD THE APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Homeland-v1.4.0-Release
        path: app/build/outputs/apk/release/*.apk
