name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

    # 🔥 THE FIX: Download Gradle 8.4 from GitHub's stable mirror
    #    (avoids the flaky services.gradle.org that has been causing 504s)
    - name: Install Gradle 8.4 from GitHub Releases
      run: |
        GRADLE_VERSION="8.4"
        INSTALL_DIR="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"

        echo "Downloading Gradle ${GRADLE_VERSION} from GitHub releases mirror..."
        curl -fsSL "https://github.com/gradle/gradle-distributions/releases/download/v${GRADLE_VERSION}.0/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip

        echo "Extracting..."
        unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"

        echo "$INSTALL_DIR/bin" >> $GITHUB_PATH

        echo "✅ Gradle ${GRADLE_VERSION} installed at ${INSTALL_DIR}"

    - name: Verify Gradle version
      run: gradle --version

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Homeland-v1.4.0-Release
        path: app/build/outputs/apk/release/*.apk
