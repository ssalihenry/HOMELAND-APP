name: Push Notification Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  send-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        cd push-server
        npm install

    - name: Run Push Worker Script
      run: |
        cd push-server
        node index.js
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
